name: Deploy

on:
  push:
    branches:
      - main
      - develop
      - 'feature/DROP-v2*'

# Serialize ALL deploys against each other, not per-branch. The group was
# previously keyed on github.ref, which put a `main` deploy and a `develop`
# deploy in DIFFERENT groups -- so they did not queue, they raced: two jobs
# each running `systemctl stop drop-platform`, `rm -rf dist/ install.sh` and
# untarring into /opt/drop on the same host. Interleaving them can leave the
# box with dist/ from one build and the dependency-lock witness from another,
# or a health check that passes against the other job's restart.
#
# cancel-in-progress is false deliberately: a deploy that has already stopped
# the service must be allowed to finish and restart it. Cancelling mid-run is
# how you get a box left stopped.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same verified definition of "good" as ci.yml -- see _verify.yml. This is
  # the only caller that needs the tarball, so it's the only one that sets
  # upload-artifact: true.
  verify:
    uses: ./.github/workflows/_verify.yml
    with:
      upload-artifact: true
    # No `secrets: inherit` -- _verify.yml declares no `secrets:` block and
    # needs none. Passing secrets here would hand them to every future step
    # added to that file, including two `npm ci` runs' worth of transitive
    # postinstall scripts.

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: hetzner
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: drop-dist

      # This protects TRANSPORT integrity, not build-time integrity: the
      # digest is computed after `npm ci`, in the same job, on the same tree
      # that produced the artifact, so a compromised transitive postinstall
      # in the verify job's two `npm ci` runs would be faithfully hashed and
      # certified along with everything else -- this step cannot catch that
      # class of compromise. What it does catch is corruption or tampering
      # introduced by the upload-artifact / download-artifact hop itself
      # (the only untrusted transfer the tarball makes between being built
      # and being shipped): the verify job hashes the tarball it just built,
      # in the same job that built it, and this re-hashes the copy that came
      # back through download-artifact, refusing to ship on any mismatch.
      # Closing the build-time gap needs `npm ci --ignore-scripts` or build
      # provenance attestation -- a separate change, not this one.
      - name: Verify artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::verify job did not report a tarball digest -- refusing to deploy an unverified artifact." >&2
            exit 1
          fi
          ACTUAL_SHA256=$(sha256sum drop-dist.tar.gz | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Artifact digest mismatch: verify job produced $EXPECTED_SHA256 but the downloaded tarball hashes to $ACTUAL_SHA256. Refusing to ship a tarball that does not match what was verified." >&2
            exit 1
          fi
          echo "Artifact digest verified: $ACTUAL_SHA256"

      - name: Set up SSH key
        run: |
          echo "${{ secrets.DEPLOY_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # `install.sh --provision` creates and hardens this directory, but the
      # FIRST deploy after Landing C ships scp's into it BEFORE that provision
      # runs -- so create it here too. `mkdir -p` is idempotent and does not
      # weaken the 0700 install.sh sets on an existing one.
      - name: Ensure the staging directory exists
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /opt/drop/staging && chmod 0700 /opt/drop/staging"

      # Staged in a drop-owned 0700 directory, NOT /tmp. /tmp is
      # world-writable and its sticky bit prevents replacement, not
      # pre-creation -- and this stages an EXECUTABLE now, which is a change of
      # kind. install.sh already refuses /tmp for the same reason.
      - name: Upload to server
        run: |
          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            drop-dist.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/drop/staging/drop-dist.tar.gz

      # Hash the install.sh that CI actually built, straight out of the
      # artifact, on the runner. This is the trusted half of the drift check
      # inside remote-deploy.sh: computing it server-side would let the drop
      # user (who owns /opt/drop/install.sh) rewrite both sides to match and
      # silence the signal. Still only a detection aid -- see its use site.
      - name: Hash the shipped install.sh
        run: |
          echo "SHIPPED_HASH=$(tar -xzOf drop-dist.tar.gz install.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # Unpack the deploy script from the artifact that was just staged.
      #
      # It has to come from the TARBALL rather than from a checkout: this job
      # holds the deploy key, and adding actions/checkout here would both widen
      # it and run a branch's copy of the deploy script against production,
      # rather than the copy `_verify.yml` shellchecked and smoke-tested.
      #
      # A single-line ssh command by construction -- see the structural guard in
      # _verify.yml. Everything multi-line now lives in the script.
      - name: Unpack the deploy script
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "tar -xzf /opt/drop/staging/drop-dist.tar.gz -C /opt/drop/staging --strip-components=2 scripts/deploy/remote-deploy.sh scripts/deploy/rollback.sh"

      # The deploy sequence is a FILE now (Landing C). `ssh host 'multi-line
      # script'` is re-parsed by the remote login shell, so one stray apostrophe
      # -- including in a comment -- truncated it silently, halfway through a
      # deploy that had already stopped the service. That is DROP-074, and
      # shellcheck could not see it. The guard in _verify.yml now enforces the
      # class rather than counting apostrophes in the one instance.
      #
      # Both arguments are validated by the script before it touches anything,
      # because `ssh host cmd arg` is re-parsed remotely and local quoting does
      # not protect them. Nothing derived from github.ref_name reaches here.
      #
      # Exit 10 means "rolled back, previous release healthy" -- a FAILED
      # deploy, so the job still fails, but the notify job below can say which
      # of the two happened.
      - name: Deploy on server
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "bash /opt/drop/staging/remote-deploy.sh ${{ env.SHIPPED_HASH }} /opt/drop/staging/drop-dist.tar.gz" \
            || { rc=$?; if [ "$rc" = "10" ]; then echo "::error::Deploy failed its health gate and was ROLLED BACK. The previous release is serving. See docs/DEPLOY-ROLLBACK.md."; else echo "::error::Deploy failed and the box state is UNKNOWN. See docs/DEPLOY-ROLLBACK.md."; fi; exit "$rc"; }

      - name: Remove deploy key
        if: always()
        run: rm -f /tmp/deploy_key

  # One mechanism, not two: files or updates a single GitHub issue rather than
  # a webhook conditioned on a secret that may not exist.
  #
  # The condition distinguishes by JOB RESULT, not by concurrency policy.
  # `cancel-in-progress: false` (see the block above) protects a deploy that
  # is already IN PROGRESS -- it does not stop a second push from superseding
  # a PENDING one: GitHub allows only one pending run per concurrency group,
  # so a third push cancels a queued middle run before its `verify` job ever
  # starts. That is an ordinary superseded-push event, same as ci.yml sees
  # constantly, and a bare `!success()` (which is true for a cancelled run,
  # since `!cancelled()` is not part of it) would file a false "Deploy
  # failing" issue for it. A prior version of this comment claimed
  # cancel-in-progress: false made that impossible; it does not -- it only
  # covers the in-progress case.
  #
  # `verify.result == 'failure'` / `deploy.result == 'failure'` catch a real
  # failure in either job. `deploy.result == 'cancelled'` catches the
  # genuinely dangerous shape this job exists for: a deploy cancelled
  # mid-flight, e.g. after `systemctl stop` but before the restart, leaving
  # production down. `always()` is required for the job to evaluate at all
  # when an upstream job failed or was cancelled -- the default `if` on a job
  # with `needs:` is `success()`, which would skip this job in exactly the
  # cases it must run.
  #
  # Deliberately NO branch restriction here, unlike ci.yml's notify job:
  # deploy.yml triggers on main, develop AND feature/DROP-v2*, and the deploy
  # job is not branch-gated on any of them -- a feature/DROP-v2* push ships
  # to the same production box. "No PR noise" (the reason ci.yml restricts to
  # main/develop) buys nothing here: this workflow has no pull_request
  # trigger to filter out. Narrowing to main/develop would silently drop the
  # exact scenario this job exists for.
  notify:
    needs: [verify, deploy]
    if: ${{ always() && (needs.verify.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    runs-on: ubuntu-latest
    # Job-level `permissions:` REPLACES the workflow default rather than
    # extending it, so leaving `contents: read` out here (as a prior version
    # of this job did) would run the token with NO contents scope at all,
    # not with the top-of-file default. Neither step below reads repo
    # content, but `contents: read` costs nothing and matches the workflow's
    # own top-level default rather than silently dropping it for this job.
    # `issues: write` is the only elevated scope this job needs.
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update a deploy failure issue
        env:
          # NEVER interpolate ${{ }} directly into a run: block -- see
          # release.yml's identical comment. A crafted commit message or
          # branch name would otherwise execute on a runner in the same
          # workflow that holds the deploy SSH key. Values arrive as env vars
          # and are referenced as "$VAR" below instead.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail

          LABEL="ci-failure"
          TITLE="Deploy failing on $BRANCH"

          BODY="$(cat <<EOF
          Run: $RUN_URL
          Workflow: $WORKFLOW
          Branch: $BRANCH
          Commit: $SHA
          Job: verify=$VERIFY_RESULT deploy=$DEPLOY_RESULT
          EOF
          )"

          # gh issue create --label fails outright if the label does not yet
          # exist on the repo. Idempotent: a no-op once the label exists.
          gh label create "$LABEL" --repo "$REPO" --color "d73a4a" \
            --description "Automated CI/deploy failure notification" 2>/dev/null || true

          EXISTING=$(gh issue list --repo "$REPO" --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label "$LABEL"
          fi
