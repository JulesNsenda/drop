name: Deploy

on:
  push:
    branches:
      - main
      - develop
      - 'feature/DROP-v2*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build server
        run: npm run build:server

      - name: Test
        run: npm test

      - name: Install dashboard dependencies
        working-directory: src/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: src/dashboard
        run: npm run build

      - name: Package artifact
        run: |
          tar -czf drop-dist.tar.gz dist/ package.json package-lock.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop-dist
          path: drop-dist.tar.gz
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: hetzner
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: drop-dist

      - name: Set up SSH key
        run: |
          echo "${{ secrets.DEPLOY_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Upload to server
        run: |
          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            drop-dist.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/drop-dist.tar.gz

      - name: Deploy on server
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'set -e
            sudo systemctl stop drop-platform
            cd /opt/drop
            rm -rf dist/
            tar -xzf /tmp/drop-dist.tar.gz
            npm ci --omit=dev
            rm -f /tmp/drop-dist.tar.gz
            sudo systemctl start drop-platform
            echo "Deploy complete"'

      - name: Remove deploy key
        if: always()
        run: rm -f /tmp/deploy_key
