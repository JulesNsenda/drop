name: Deploy

on:
  push:
    branches:
      - main
      - develop
      - 'feature/DROP-v2*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build server
        run: npm run build:server

      - name: Test
        run: npm test

      - name: Install dashboard dependencies
        working-directory: src/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: src/dashboard
        run: npm run build

      - name: Build site
        working-directory: src/dashboard
        run: npm run build:site

      - name: Verify site build output
        run: |
          if [ ! -f dist/site/index.html ]; then
            echo "::error::dist/site/index.html missing after build:site — the marketing site would ship with no frontend" >&2
            exit 1
          fi

      - name: Verify the site bundle doesn't ship admin code (DROP-070)
        run: |
          if grep -q 'drop-token\|ConfirmDialog\|qrcode' dist/site/assets/*.js; then
            echo "::error::dist/site JS references admin-only code (drop-token/ConfirmDialog/qrcode) — the marketing/dashboard bundle split has regressed" >&2
            exit 1
          fi

      - name: Package artifact
        run: |
          tar -czf drop-dist.tar.gz dist/ install.sh package.json package-lock.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop-dist
          path: drop-dist.tar.gz
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: hetzner
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: drop-dist

      - name: Set up SSH key
        run: |
          echo "${{ secrets.DEPLOY_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Upload to server
        run: |
          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            drop-dist.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/drop-dist.tar.gz

      # Hash the install.sh that CI actually built, straight out of the
      # artifact, on the runner. This is the trusted half of the drift check
      # below: computing it server-side would let the drop user (who owns
      # /opt/drop/install.sh) rewrite both sides to match and silence the
      # signal. Still only a detection aid — see the comment at its use site.
      - name: Hash the shipped install.sh
        run: |
          echo "SHIPPED_HASH=$(tar -xzOf drop-dist.tar.gz install.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Deploy on server
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'set -e
            sudo systemctl stop drop-platform
            cd /opt/drop
            rm -rf dist/ install.sh
            tar -xzf /tmp/drop-dist.tar.gz
            # npm ci wipes and rebuilds node_modules from scratch every time,
            # which means compiling native bcrypt on a 4 GB box while the
            # service is already stopped. Skip it when the lockfile is
            # byte-identical to the one installed last deploy.
            #
            # The witness lives INSIDE node_modules on purpose: npm ci removes
            # that whole tree before installing, so the witness cannot outlive
            # the tree it describes. An interrupted or failed install therefore
            # leaves no witness and the next deploy installs, where a witness
            # kept beside package.json would have survived and been trusted.
            [ -f package-lock.json ] || { echo "package-lock.json missing from artifact" >&2; exit 1; }
            LOCK_HASH=$(sha256sum package-lock.json | cut -d" " -f1)
            PREV_HASH=$(cat node_modules/.deploy-lock-hash 2>/dev/null || echo none)
            if [ "$LOCK_HASH" = "$PREV_HASH" ]; then
              echo "Dependencies unchanged - skipping npm ci"
            else
              npm ci --omit=dev
              echo "$LOCK_HASH" > node_modules/.deploy-lock-hash
            fi
            rm -f /tmp/drop-dist.tar.gz
            # Re-apply system provisioning (Caddy, systemd unit, env, apex route)
            # so infra changes in install.sh land on the server. This also
            # restarts the service.
            #
            # Preferred target is the root-owned /usr/local/sbin/drop-provision
            # (DROP-071) — a copy of install.sh outside /opt/drop, which is
            # chown'd to the drop user and therefore not something root should
            # ever be sudo'd into running directly. The middle arm is legacy:
            # a box bootstrapped before DROP-071 only has a sudoers rule for
            # /opt/drop/install.sh directly, and running --provision through
            # it (the new install.sh code, just untarred above) is what seeds
            # /usr/local/sbin/drop-provision and rewrites the sudoers rule to
            # point at it — so the very next deploy takes the first branch.
            # Until the server has been provisioned at least once (either
            # way), fall back to a plain restart so the deploy still ships the
            # new code.
            # The interpreter is pinned to an absolute /usr/bin/bash and MUST
            # match install.sh's write_sudoers rule byte for byte (interpreter
            # + path + args) or sudo refuses and this silently falls through to
            # the legacy arm. Pinning matters: exec'ing the script directly
            # would honour its #!/usr/bin/env bash shebang, and sudo's
            # secure_path starts with /usr/local/sbin:/usr/local/bin — the
            # latter root:staff 2775 on stock Debian, so `bash` could resolve
            # to something other than the real interpreter.
            if sudo -n /usr/bin/bash /usr/local/sbin/drop-provision --provision; then
              echo "System provisioning applied"
            elif sudo -n /usr/bin/bash /opt/drop/install.sh --provision; then
              echo "System provisioning applied (legacy sudoers rule — server will use /usr/local/sbin/drop-provision from the next deploy)"
            else
              echo "::warning::Provisioning unavailable — falling back to restart. Bootstrap install.sh on the server to enable self-provisioning."
              sudo systemctl restart drop-platform
            fi
            # Staleness check (DROP-071 follow-up): --provision alone only
            # re-applies whatever provisioning logic was last installed into
            # /usr/local/sbin/drop-provision — see install.sh's
            # install_provision_script for why. Compare it against the
            # install.sh just untarred above so an infra change (systemd
            # unit, Caddy setup, sudoers, apex route) that shipped in THIS
            # deploy but silently did not take effect is visible, instead of
            # the box quietly diverging from what the repo says it should be.
            #
            # This is a DETECTION AID ONLY, deliberately unauthenticated — a
            # plain sha256sum comparison, no secret involved. It proves
            # nothing about trust: an actor who could forge one side of it
            # could already do worse (see install.sh's trust-chain comment).
            # Never read a match here as "the box is provisioned correctly"
            # or build any authorization decision on it.
            #
            # --bootstrap (not --upgrade) is the correct remediation on this
            # deployment model: /opt/drop is populated by this tarball
            # extraction, not a git clone, so --upgrade's `git -C /opt/drop
            # fetch` would fail outright (no .git here). --bootstrap re-runs
            # provisioning idempotently against whatever install.sh already
            # sits in /opt/drop, without needing a git checkout.
            #
            # Deliberately non-fatal: a stale-but-working box is not an
            # outage, and failing the deploy here would block shipping
            # application code over an unrelated infra drift.
            # SHIPPED_HASH is passed in from the runner (computed straight out
            # of the CI-built tarball, see the env: block on this step) rather
            # than recomputed here from /opt/drop/install.sh. On the server the
            # drop user owns that file and could rewrite it between the untar
            # above and this line, making both sides match and permanently
            # silencing the one staleness signal. Runner-side, one half of the
            # comparison is genuinely CI-authored.
            if [ -x /usr/local/sbin/drop-provision ]; then
              INSTALLED_HASH=$(sha256sum /usr/local/sbin/drop-provision | cut -d" " -f1)
              if [ "${{ env.SHIPPED_HASH }}" != "$INSTALLED_HASH" ]; then
                echo "::warning::The install.sh shipped in this deploy differs from /usr/local/sbin/drop-provision — provisioning changes (systemd unit, Caddy, sudoers, apex route) have NOT been applied. To remediate, copy a TRUSTED install.sh to the box and run it as root: scp install.sh root@<host>:/tmp/ && ssh root@<host> 'bash /tmp/install.sh --bootstrap'. Do NOT run /opt/drop/install.sh as root — it is writable by the drop user, which is the exact primitive DROP-071 removes."
              fi
            fi
            # Verify the service actually came back up before calling it a
            # success. Probe /health/live, which is unconditionally 200 when the
            # process is serving — /api/v1/health returns 503 whenever PM2 or
            # Postgres probe down, which a slow boot does routinely (see
            # DROP-063, where the internal readiness gate went 20s -> 60s for
            # this reason). Window is 60s to match that gate.
            #
            # Deliberately NO automatic dependency reinstall here: npm ci
            # removes node_modules before installing, so a reinstall that then
            # fails (an OOM compiling bcrypt on a 4 GB box is the realistic
            # case) would leave the box with no dependencies at all, crash-
            # looping on MODULE_NOT_FOUND under Restart=on-failure. Failing the
            # deploy loudly is strictly safer than a destructive self-heal.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3000/api/v1/health/live >/dev/null 2>&1; then
                echo "Health check passed"; break
              fi
              if [ "$i" = "30" ]; then echo "Health check FAILED after restart" >&2; exit 1; fi
              sleep 2
            done
            echo "Deploy complete"'

      - name: Remove deploy key
        if: always()
        run: rm -f /tmp/deploy_key
