name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
    # No `secrets: inherit` -- _verify.yml declares no `secrets:` block and
    # needs none. Passing secrets here would hand them to every future step
    # added to that file, including two `npm ci` runs' worth of transitive
    # postinstall scripts, on every PR (including from forks).
    # upload-artifact defaults to false: CI never ships anything, so there is
    # nothing here worth packaging.
    #
    # No `on: push` and no notify job here: this workflow used to trigger on
    # push to main/develop too, which duplicated deploy.yml's identical
    # _verify.yml call for zero extra signal (deploy.yml already runs on a
    # superset of branches) and raced deploy.yml's notify job over the same
    # ci-failure label -- both queried it, both saw nothing, both filed,
    # after which the second issue's `.[0]` comment attached a DEPLOY failure
    # to an issue titled "CI failing". Now pull_request-only: a PR's own
    # checks UI already surfaces a failure to the person who can fix it, and
    # deploy.yml's notify job is the one mechanism for push failures.
